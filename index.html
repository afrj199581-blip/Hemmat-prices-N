<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أسعار الصيدلية والمستلزمات</title>
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #ccfbf1;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
        }
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-card {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.07);
            height: fit-content;
            margin-top: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--primary-dark);
            margin: 0 0 10px 0;
            font-size: 1.45rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .badge-count {
            display: inline-block;
            background: #f0fdfa;
            color: var(--primary-dark);
            border: 1px solid #99f6e4;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* حقل البحث */
        .search-box {
            position: relative;
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 45px;
            font-size: 1.05rem;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
            color: var(--text);
            font-weight: 500;
        }
        .search-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
        }
        .clear-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #e2e8f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            font-size: 0.9rem;
            font-weight: bold;
            color: #475569;
            transition: 0.15s;
        }
        .clear-btn:hover {
            background: #cbd5e1;
        }

        /* قائمة التوقعات المنسدلة */
        .suggestions {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            left: 0;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            display: none;
        }
        .suggestion-item {
            padding: 13px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover, .suggestion-item:active {
            background-color: #f0fdfa;
        }
        .suggestion-name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .suggestion-prices {
            display: flex;
            gap: 6px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .tag-pub {
            font-size: 0.8rem;
            background: #ccfbf1;
            color: #115e59;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* بطاقة النتيجة والأسعار */
        .result-card {
            background: linear-gradient(145deg, #0f766e, #0d9488);
            color: #ffffff;
            padding: 22px 18px;
            border-radius: 18px;
            display: none;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.25);
            animation: slideUp 0.25s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .item-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.15);
            padding: 12px;
            border-radius: 12px;
            line-height: 1.4;
        }
        .prices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            text-align: center;
        }
        .price-box {
            background: rgba(255, 255, 255, 0.14);
            padding: 14px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
        }
        .price-box.highlight {
            background: rgba(255, 255, 255, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .price-label {
            font-size: 0.85rem;
            opacity: 0.92;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }
        .price-value {
            font-size: 1.45rem;
            font-weight: 800;
        }
        .currency {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-right: 2px;
        }
    </style>
</head>

// ⬆️⬆️⬆️ نهاية مكان لصق الأصناف ⬆️⬆️⬆️

// في حال وجود بيانات في الكود نعتمدها، وإلا نأخذ من ذاكرة المتصفح الاحتياطية
const products = (typeof initialProducts !== 'undefined' && initialProducts.length > 0) 
    ? initialProducts 
    : (JSON.parse(localStorage.getItem('pharmacy_products')) || []);

const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestionsBox');
const resultCard = document.getElementById('resultCard');
const clearBtn = document.getElementById('clearBtn');
const itemCount = document.getElementById('itemCount');

itemCount.textContent = `إجمالي الأصناف المسجلة: ${products.length} صنف`;

// توحيد الأرقام والحروف العربية لتسهيل البحث الذكي
function normalizeArabic(text) {
    if (!text) return "";
    const eastern = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    let res = text.toString();
    eastern.forEach((d, i) => { res = res.replace(new RegExp(d, 'g'), i); });
    return res
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/[ىئ]/g, 'ي')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
}

// البحث الفوري وإظهار القائمة المتوقعة
searchInput.addEventListener('input', function() {
    const query = normalizeArabic(this.value);
    suggestionsBox.innerHTML = '';
    
    if (this.value.length > 0) {
        clearBtn.style.display = 'block';
    } else {
        clearBtn.style.display = 'none';
        suggestionsBox.style.display = 'none';
        return;
    }

    const words = query.split(' ').filter(w => w.length > 0);
    const matches = products.filter(p => {
        const normName = normalizeArabic(p.name);
        return words.every(w => normName.includes(w));
    }).slice(0, 45);

    if (matches.length > 0) {
        matches.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `
                <span class="suggestion-name">${item.name}</span>
                <div class="suggestion-prices">
                    <span class="tag-pub">جمهور: ${item.pub} ج</span>
                </div>
            `;
            div.addEventListener('click', () => selectProduct(item));
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = 'block';
    } else {
        suggestionsBox.innerHTML = '<div class="suggestion-item" style="justify-content:center; color:#64748b;">لا توجد أصناف مطابقة للبحث</div>';
        suggestionsBox.style.display = 'block';
    }
});

// عرض تفاصيل الصنف وحساب المكسب ونسبته المئوية
function selectProduct(item) {
    searchInput.value = item.name;
    suggestionsBox.style.display = 'none';
    
    const pharm = Number(item.pharm) || 0;
    const pub = Number(item.pub) || 0;
    const profit = pub - pharm;
    
    // حساب نسبة ربح الصيدلي من سعر الجمهور (أو من التكلفة)
    const marginPercent = pub > 0 ? ((profit / pub) * 100).toFixed(1) : 0;

    document.getElementById('resName').textContent = item.name;
    document.getElementById('resPharm').textContent = pharm.toFixed(2);
    document.getElementById('resPub').textContent = pub.toFixed(2);
    document.getElementById('resProfit').textContent = profit.toFixed(2);
    document.getElementById('resMargin').textContent = `${marginPercent}%`;
    
    resultCard.style.display = 'block';
}

clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    suggestionsBox.style.display = 'none';
    resultCard.style.display = 'none';
    searchInput.focus();
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) {
        suggestionsBox.style.display = 'none';
    }
});
</script>
